<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お弁当献立グラム計算ツール</title>

    <style>
        :root {
            --main: #ff8c00;
            --bg: #fffcf5;
            --y: #ffd700;
            --r: #ff4500;
            --g: #32cd32;
        }

        body {
            font-family: sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 15px;
            color: #444;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--main);
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .sub {
            font-size: 0.8rem;
            text-align: center;
            color: #777;
            margin-bottom: 20px;
        }

        .section-title {
            font-weight: bold;
            margin: 15px 0 8px;
            padding-left: 8px;
            border-left: 5px solid;
        }

        .title-y {
            border-color: var(--y);
        }

        .title-r {
            border-color: var(--r);
        }

        .title-g {
            border-color: var(--g);
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .item-card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 8px;
            background: #fafafa;
            font-size: 0.85rem;
        }

        .item-card input {
            margin-right: 5px;
        }

        .vol-select {
            display: none;
            margin-top: 5px;
            width: 100%;
            font-size: 0.75rem;
            padding: 3px;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            border: 3px solid var(--main);
            border-radius: 15px;
            text-align: center;
            background: #fffcfa;
        }

        /* =========================
           キャラクター画像
           ========================= */

        .chara-img {
            width: 35px !important;
            height: 35px !important;
            max-width: 35px !important;
            max-height: 35px !important;

            object-fit: contain;

            display: block;
            margin: 0 auto 10px auto;
        }

        .total-g {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--main);
            margin: 5px 0;
        }

        .calc-btn {
            width: 100%;
            padding: 15px;
            background: var(--main);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        .calc-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🍱 献立グラム計算ツール</h1>

    <div class="sub">
        カードで選んだ食材をチェックして量を選ぼう！
    </div>


    <form id="menuForm">

        <!-- 🟡 主食 -->
        <div class="section-title title-y">
            🟡 主食・エネルギー
        </div>

        <div class="item-grid" id="group-y"></div>


        <!-- 🔴 主菜 -->
        <div class="section-title title-r">
            🔴 主菜・からだ作り
        </div>

        <div class="item-grid" id="group-r"></div>


        <!-- 🟢 副菜 -->
        <div class="section-title title-g">
            🟢 副菜・コンディショニング
        </div>

        <div class="item-grid" id="group-g"></div>


        <button
            type="button"
            class="calc-btn"
            onclick="calculate()"
        >
            合計の量を計算する！
        </button>

    </form>


    <!-- =========================
         結果表示
         ========================= -->

    <div
        class="result-box"
        id="result"
        style="display:none;"
    >

        <img
            src="IMG_1014 2.png"
            class="chara-img"
            alt="キャラクター"
        >

        <div>
            お弁当の合計重量
        </div>

        <div
            class="total-g"
            id="totalGram"
        >
            0 g
        </div>

        <p
            id="feedbackMsg"
            style="
                font-size: 0.95rem;
                margin-top: 10px;
                line-height: 1.4;
            "
        ></p>

    </div>

</div>


<script>

    /* =========================
       食材データ
       ========================= */

    const foods = [

        /* 🟡 主食・エネルギー */

        {
            id: 'f1',
            name: '米',
            cat: 'y',
            base: 150
        },

        {
            id: 'f2',
            name: 'パン',
            cat: 'y',
            base: 100
        },

        {
            id: 'f3',
            name: 'パスタ',
            cat: 'y',
            base: 150
        },

        {
            id: 'f4',
            name: 'うどん',
            cat: 'y',
            base: 180
        },

        {
            id: 'f5',
            name: '中華麺',
            cat: 'y',
            base: 150
        },

        {
            id: 'f6',
            name: 'そうめん',
            cat: 'y',
            base: 150
        },

        {
            id: 'f7',
            name: 'さつまいも',
            cat: 'y',
            base: 80
        },

        {
            id: 'f8',
            name: '栗',
            cat: 'y',
            base: 40
        },

        {
            id: 'f9',
            name: '里芋',
            cat: 'y',
            base: 60
        },


        /* 🔴 主菜・からだ作り */

        {
            id: 'f10',
            name: '牛ひき肉',
            cat: 'r',
            base: 60
        },

        {
            id: 'f11',
            name: '豚ひき肉',
            cat: 'r',
            base: 60
        },

        {
            id: 'f12',
            name: '鶏ひき肉',
            cat: 'r',
            base: 60
        },

        {
            id: 'f13',
            name: '鶏肉',
            cat: 'r',
            base: 80
        },

        {
            id: 'f14',
            name: '豚ロース',
            cat: 'r',
            base: 80
        },

        {
            id: 'f15',
            name: 'タイ',
            cat: 'r',
            base: 70
        },

        {
            id: 'f16',
            name: 'マグロ',
            cat: 'r',
            base: 70
        },

        {
            id: 'f17',
            name: 'イカ',
            cat: 'r',
            base: 60
        },

        {
            id: 'f18',
            name: 'エビ',
            cat: 'r',
            base: 60
        },

        {
            id: 'f19',
            name: '鮭',
            cat: 'r',
            base: 70
        },

        {
            id: 'f20',
            name: 'あさり',
            cat: 'r',
            base: 40
        },

        {
            id: 'f21',
            name: '卵',
            cat: 'r',
            base: 50
        },

        {
            id: 'f22',
            name: '豆腐',
            cat: 'r',
            base: 60
        },

        {
            id: 'f23',
            name: '納豆',
            cat: 'r',

        },

        {
            id: 'f24',

        },

        {

        {
            id: 'f26',
            name: 'ヨーグルト',
            cat: 'r',
            base: 80
        },


        /* 🟢 副菜・コンディショニング */

        {
            id: 'f27',
            name: 'れんこん',
            cat: 'g',
            base: 40
        },

        {
            id: 'f28',
            name: 'ぎんなん',
            cat: 'g',
            base: 15
        },

        {
            id: 'f29',
            name: 'しめじ',
            cat: 'g',
            base: 30
        },

        {
            id: 'f30',
            name: '春菊',
            cat: 'g',
            base: 30
        },

        {
            id: 'f31',
            name: '柿',
            cat: 'g',
            base: 50
        },

        {
            id: 'f32',
            name: 'ぶどう',
            cat: 'g',
            base: 50
        },

        {
            id: 'f33',
            name: 'ごぼう',
            cat: 'g',
            base: 30
        },

        {
            id: 'f34',
            name: 'バター',
            cat: 'g',
            base: 10
        }

    ];


    /* =========================
       食材カードを表示
       ========================= */

    function renderFoods() {

        foods.forEach(f => {

            const container =
                document.getElementById(`group-${f.cat}`);

            const div =
                document.createElement('div');

            div.className = 'item-card';

            div.innerHTML = `

                <label>

                    <input
                        type="checkbox"
                        id="chk_${f.id}"
                        onchange="toggleVol('${f.id}')"
                    >

                    ${f.name}

                </label>

                <select
                    id="vol_${f.id}"
                    class="vol-select"
                >

                    <option value="0.7">
                        少なめ
                    </option>

                    <option
                        value="1.0"
                        selected
                    >
                        ふつう
                    </option>

                    <option value="1.3">
                        多め
                    </option>

                </select>

            `;

            container.appendChild(div);

        });

    }


    /* =========================
       量の選択欄を表示・非表示
       ========================= */

    function toggleVol(id) {

        const chk =
            document.getElementById(`chk_${id}`);

        const vol =
            document.getElementById(`vol_${id}`);

        if (chk.checked) {

            vol.style.display = 'block';

        } else {

            vol.style.display = 'none';

        }

    }


    /* =========================
       合計計算
       ========================= */

    function calculate() {

        let total = 0;


        foods.forEach(f => {

            const chk =
                document.getElementById(`chk_${f.id}`);


            if (chk && chk.checked) {

                const rate =
                    parseFloat(
                        document
                            .getElementById(`vol_${f.id}`)
                            .value
                    );


                total +=
                    Math.round(
                        f.base * rate
                    );

            }

        });


        /* 合計重量 */

        document
            .getElementById('totalGram')
            .innerText = `${total} g`;


        /* =========================
           メッセージ
           ========================= */

        let msg = "";


        if (total === 0) {

            msg =
                "食材をひとつ以上えらんでね！";

        }

        else if (total < 450) {

            msg =
                "やや控えめなボリューム！塾や部活がある日はおやつをプラスすると安心だよ。";

        }

        else if (total <= 700) {

            msg =
                "中高生にピッタリの標準的なバランス量！午後もしっかりエネルギーが持続するよ✨";

        }

        else {

            msg =
                "しっかり大盛りボリューム！運動部やガッツリ動く日に最高のスタミナ弁当だね！";

        }


        document
            .getElementById('feedbackMsg')
            .innerText = msg;


        /* 結果を表示 */

        document
            .getElementById('result')
            .style.display = 'block';


        /* 結果までスクロール */

        window.scrollTo({

            top: document.body.scrollHeight,

            behavior: 'smooth'

        });

    }


    /* =========================
       ページ読み込み時に実行
       ========================= */

    renderFoods();

</script>

</body>
</html>
